name: Render Cloud 24-7 Keep-Alive (Buk Sukjai Bot)

on:
  schedule:
    # Ping every 10 minutes 24/7 so Render Free instance never sleeps through 07:00 AM BKK (00:00 UTC)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and verify Buk Sukjai Render Cloud
        run: |
          curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "https://buksukjai-omnichannel-twht.onrender.com/health"
